<!DOCTYPE html>
<html lang="en">
<head>
<meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'>
<title>Math Wizard</title>
<style>
body{background:var(--body-bg,#0d1117);color:var(--text-color,#e0e0e0);font-family:sans-serif;margin:0;padding:20px;}
.btn{background:#1a73e8;color:white;border:none;border-radius:6px;padding:8px 18px;cursor:pointer;font-size:1rem;margin:4px;}

<body>
<a href='{{site.baseurl}}/csa/unit_01/1_11' style='color:#1a73e8;'>&#8592; Back to Lesson</a>
<h2>&#127918; Math Wizard</h2>
<p style="margin:.4em 0 1em;">The Math class has powerful methods — chain them together to transform the starting value to the target!</p>

<style>
#display{font-size:2rem;text-align:center;padding:18px;background:#161b22;
border-radius:8px;margin:10px 0;}
#target{font-size:1.1rem;text-align:center;margin-bottom:10px;}
.mop{font-size:.85rem;padding:8px 10px;border-radius:6px;background:#1f2937;
border:2px solid #374151;color:#e0e0e0;cursor:pointer;margin:4px;}
.mop:hover{border-color:#1a73e8;}
#hist{font-family:monospace;font-size:.85rem;color:#888;margin:8px 0;min-height:1.4em;}
#msg{font-size:1rem;min-height:1.4em;}
#lev{margin-bottom:6px;}
</style>
<div id='lev'>Level 1 / 6</div>
<div id='target'></div>
<div id='display'></div>
<div style='text-align:center;'>
<button class='mop' onclick='apply("abs")'>Math.abs()</button>
<button class='mop' onclick='apply("pow2")'>Math.pow(x,2)</button>
<button class='mop' onclick='apply("sqrt")'>Math.sqrt()</button>
<button class='mop' onclick='apply("floor")'>Math.floor()</button>
<button class='mop' onclick='apply("ceil")'>Math.ceil()</button>
</div>
<button class='btn' style='background:#444;margin-top:8px;' onclick='reset()'>&#8635; Reset</button>
<div id='hist'></div>
<div id='msg'></div>
<script>
var levels=[
  {start:-5,target:5,hint:'abs'},
  {start:3,target:9,hint:'pow2'},
  {start:16,target:4,hint:'sqrt'},
  {start:3.7,target:3,hint:'floor'},
  {start:3.2,target:4,hint:'ceil'},
  {start:-4,target:16,hint:'abs then pow2'}
];
var lv=0,cur=0,hist=[];
var disp=document.getElementById('display');
var tgt=document.getElementById('target');
var histEl=document.getElementById('hist');
var msg=document.getElementById('msg');
var levEl=document.getElementById('lev');
function show(){
  cur=levels[lv].start;hist=[];
  disp.textContent=cur;
  tgt.textContent='Target: '+levels[lv].target;
  histEl.textContent='';msg.textContent='';
}
function apply(fn){
  var prev=cur;
  if(fn==='abs')cur=Math.abs(cur);
  else if(fn==='pow2')cur=Math.pow(cur,2);
  else if(fn==='sqrt')cur=parseFloat(Math.sqrt(cur).toFixed(4));
  else if(fn==='floor')cur=Math.floor(cur);
  else if(fn==='ceil')cur=Math.ceil(cur);
  hist.push('Math.'+(fn==='pow2'?'pow('+prev+',2)':fn+'('+prev+')')+' = '+cur);
  histEl.textContent=hist.join(' → ');
  disp.textContent=cur;
  if(cur===levels[lv].target){
    msg.style.color='#4caf50';msg.textContent='&#127881; Level '+(lv+1)+' complete!';
    lv++;
    if(lv>=levels.length){msg.textContent='&#127881; All levels complete! You're a Math wizard!';return;}
    setTimeout(function(){levEl.textContent='Level '+(lv+1)+' / 6';show();},1400);
  }
}
function reset(){show();}
show();
</script>
</body>
</html>
