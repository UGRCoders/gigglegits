<!DOCTYPE html>
<html lang="en">
<head>
<meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'>
<title>Talk to the Robot</title>
<style>
body{background:var(--body-bg,#0d1117);color:var(--text-color,#e0e0e0);font-family:sans-serif;margin:0;padding:20px;}
.btn{background:#1a73e8;color:white;border:none;border-radius:6px;padding:8px 18px;cursor:pointer;font-size:1rem;margin:4px;}
.btn:hover{opacity:.85;}
h2{margin:.4em 0;}
</style>
</head>
<body>
<a href='{{site.baseurl}}/csa/unit_01/1_4' style='color:#1a73e8;'>&#8592; Back to Lesson</a>
<h2>&#127918; Talk to the Robot</h2>
<p style="margin:.4em 0 1em;">Scanner reads user input — give the robot the right answers to reach a happy ending!</p>

<style>
#robot{font-size:3rem;text-align:center;}
#bubble{background:#1f2937;border-radius:8px;padding:12px 16px;margin:10px 0;
font-size:1.05rem;min-height:2em;}
#inp{background:#161b22;color:#e0e0e0;border:1px solid #374151;border-radius:6px;
padding:8px 12px;font-size:1rem;width:100%;max-width:320px;box-sizing:border-box;}
#msg{margin-top:8px;font-size:1rem;min-height:1.4em;}
</style>
<div id='robot'>&#129302;</div>
<div id='bubble'>Loading...</div>
<input id='inp' type='text' placeholder='Type your answer...' onkeydown='if(event.key==="Enter")submit()'>
<br><br>
<button class='btn' onclick='submit()'>&#9654; Submit</button>
<div id='msg'></div>
<script>
var steps=[
  {q:'Scanner input: Enter your name:',key:'name',hint:''},
  {q:'Scanner input: Enter your age:',key:'age',hint:'Try a number'},
  {q:'Scanner input: Enter your favorite color:',key:'color',hint:''},
  {q:'Scanner input: Enter a secret code (hint: it's 42):',key:'code',hint:''}
];
var answers={};var idx=0;
var bubble=document.getElementById('bubble');
var inp=document.getElementById('inp');
var msg=document.getElementById('msg');
var robot=document.getElementById('robot');
function ask(){
  if(idx<steps.length){bubble.textContent=steps[idx].q;inp.value='';inp.focus();}
}
function submit(){
  var v=inp.value.trim();if(!v)return;
  msg.textContent='';
  if(idx===0){
    answers.name=v;bubble.textContent='Hello, '+v+'! Nice to meet you.';
    setTimeout(function(){idx++;ask();},1200);
  } else if(idx===1){
    var age=parseInt(v);
    if(isNaN(age)){msg.style.color='#f44336';msg.textContent='Please enter a number for age!';return;}
    answers.age=age;
    bubble.textContent=age>=18?'You can vote! &#128499;':'You're '+age+' — too young to vote, but keep learning!';
    setTimeout(function(){idx++;ask();},1400);
  } else if(idx===2){
    answers.color=v;bubble.textContent='"'+v+'" — great choice! My circuits like that color.';
    setTimeout(function(){idx++;ask();},1200);
  } else if(idx===3){
    if(v==='42'){robot.textContent='&#129395;';bubble.innerHTML='<strong>Access granted!</strong> Welcome, '+answers.name+'! You cracked the code!';
      msg.style.color='#4caf50';msg.textContent='&#127881; Happy ending reached! Input shapes program flow.';}
    else{bubble.textContent='Wrong code! The robot stays grumpy. Try "42"...';robot.textContent='&#128544;';}
  }
}
ask();
</script>
</body>
</html>
