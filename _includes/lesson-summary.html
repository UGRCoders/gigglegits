{% comment %}
  Renders a brief overview paragraph for pages that aren't teaching a concept
  (sprint plans, reflection tools, project showcases, etc.), from page.summary front matter.
{% endcomment %}
{% if page.summary %}
<div class="lesson-summary">
  <h3>Overview</h3>
  <p>{{ page.summary }}</p>
</div>

<style>
  .lesson-summary {
    margin-top: 40px;
    padding: 20px 24px;
    border: 1px solid var(--ui-border);
    border-radius: 14px;
    background: var(--panel-mid);
  }

  .lesson-summary h3 {
    margin: 0 0 8px;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--pref-text-color);
  }

  .lesson-summary p {
    margin: 0;
    font-size: 0.92rem;
    line-height: 1.6;
    color: var(--text-muted);
  }
</style>
{% endif %}
